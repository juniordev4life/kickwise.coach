name: Match Day (terraform)

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/match-day.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      mode:
        description: plan or apply
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  GCP_PROJECT: kickwise-prod
  WIF_PROVIDER: projects/264607219534/locations/global/workloadIdentityPools/kickwise-euw3-pool-github/providers/kickwise-euw3-prov-github
  DEPLOY_SA: kickwise-euw3-sa-gha-deploy@kickwise-prod.iam.gserviceaccount.com
  TF_VERSION: "1.10.0"
  TF_VAR_FILE: environments/prod.tfvars

jobs:
  terraform:
    name: Terraform plan/apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        if: github.event_name == 'pull_request' || github.event.inputs.mode == 'plan' || github.event_name == 'push'
        run: terraform plan -var-file="${TF_VAR_FILE}" -no-color -input=false

      - name: terraform apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'apply'
        run: terraform apply -var-file="${TF_VAR_FILE}" -auto-approve -input=false
